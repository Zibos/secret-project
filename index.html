<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .question {
            font-size: 3rem;
            color: #d63384;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
        }

        .btn {
            padding: 20px 50px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            color: white;
        }

        .btn-yes {
            background: linear-gradient(135deg, #28a745, #20c997);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-yes:hover {
            box-shadow: 0 12px 30px rgba(40, 167, 69, 0.6);
        }

        .btn-no {
            background: linear-gradient(135deg, #dc3545, #e74c3c);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
            position: absolute;
        }

        .btn-no.initial {
            position: relative;
        }

        .congratulations {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .congratulations h1 {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);
        }

        .congratulations p {
            font-size: 2rem;
            color: #d63384;
        }

        .congratulations .hearts {
            font-size: 5rem;
            margin-top: 30px;
            animation: pulse 1s infinite;
        }

        .angry-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .angry-screen img {
            max-width: 400px;
            max-height: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .angry-screen p {
            font-size: 2.5rem;
            color: #dc3545;
            margin-top: 30px;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1 class="question">Will you be my Valentine? 💕</h1>
        <div class="buttons" id="buttonsContainer">
            <button class="btn btn-yes" id="yesBtn">Yes</button>
            <button class="btn btn-no initial" id="noBtn">No</button>
        </div>
    </div>

    <div class="congratulations" id="congratsScreen">
        <h1>🎉 Congratulations! 🎉</h1>
        <p>See you on Saturday at 7:45 PM</p>
        <div class="hearts">💖💕💖</div>
    </div>

    <div class="angry-screen" id="angryScreen">
        <img src="angry-cat-meme.png" alt="Angry Cat">
        <p>Stop messing with me 😠</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('mainContainer');
        const congratsScreen = document.getElementById('congratsScreen');
        const angryScreen = document.getElementById('angryScreen');
        const buttonsContainer = document.getElementById('buttonsContainer');

        let hoverCount = 0;
        let originalYesSize = 1;
        const maxHovers = 8;

        // Yes button click handler
        yesBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            angryScreen.classList.add('hidden');
            congratsScreen.style.display = 'block';
        });

        // No button hover handler
        noBtn.addEventListener('mouseenter', () => {
            hoverCount++;

            if (hoverCount >= maxHovers) {
                // Show angry cat screen
                mainContainer.classList.add('hidden');
                angryScreen.style.display = 'block';

                // Reset after 5 seconds
                setTimeout(() => {
                    resetGame();
                }, 5000);
                return;
            }

            // Move No button to random position
            noBtn.classList.remove('initial');
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 20;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.random() * (maxX - padding) + padding;
            const randomY = Math.random() * (maxY - padding) + padding;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Grow Yes button and center it horizontally (keep same Y position)
            originalYesSize += 0.1;
            yesBtn.style.transform = `scale(${originalYesSize})`;
        });

        function resetGame() {
            hoverCount = 0;
            originalYesSize = 1;

            // Hide screens
            angryScreen.style.display = 'none';
            congratsScreen.style.display = 'none';
            mainContainer.classList.remove('hidden');

            // Reset Yes button
            yesBtn.style.position = '';
            yesBtn.style.left = '';
            yesBtn.style.top = '';
            yesBtn.style.transform = '';

            // Reset No button
            noBtn.classList.add('initial');
            noBtn.style.left = '';
            noBtn.style.top = '';
        }
    </script>
</body>
</html>
